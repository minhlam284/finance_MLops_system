apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: fraud-detection
spec:
  predictor:
    serviceAccountName: fraud-model-sa
    containers:
      - name: kserve-container
        image: ghcr.io/example/finance-fraud-predictor:latest
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 8080
            protocol: TCP
        env:
          - name: MODEL_DIR
            value: /app/artifacts/serving/fraud_detection_model/2
          - name: AWS_ENDPOINT_URL
            value: http://minio.minio.svc.cluster.local:9000
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: fraud-model-s3-secret
                key: access_key
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: fraud-model-s3-secret
                key: secret_key
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 20
