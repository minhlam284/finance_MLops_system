# .github/workflows/ml_pipeline.yml
#
# CI/CD – Finance ML Pipeline
#
# Track A: CI for ML code (lint + unit tests + DAG validation)
# Track B: Smoke-test model training with tiny synthetic data
#
# Triggers:
#   - Push / PR to main / develop on paths: src/finance_mlops/pipelines/training/**, src/finance_mlops/pipelines/inference/batch_streaming/**, src/finance_mlops/pipelines/inference/online_kserve/**, deploy/k8s/**
#   - Manual dispatch (workflow_dispatch)

name: ML Pipeline CI

on:
  push:
    branches: [main, develop]
    paths:
      - "src/finance_mlops/pipelines/training/**"
      - "src/finance_mlops/pipelines/inference/batch_streaming/**"
      - "src/finance_mlops/pipelines/lakehouse/features/**"
      - "src/finance_mlops/pipelines/inference/online_kserve/**"
      - "orchestration/airflow/dags/**"
      - "deploy/k8s/kserve/**"
      - "deploy/docker/kserve-predictor.Dockerfile"
      - "pyproject.toml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/finance_mlops/pipelines/training/**"
      - "src/finance_mlops/pipelines/inference/batch_streaming/**"
      - "src/finance_mlops/pipelines/lakehouse/features/**"
      - "src/finance_mlops/pipelines/inference/online_kserve/**"
      - "orchestration/airflow/dags/**"
      - "deploy/k8s/kserve/**"
      - "deploy/docker/kserve-predictor.Dockerfile"
      - "pyproject.toml"
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  PYTHON_VERSION: "3.11"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Track A-1: Lint & static analysis ───────────────────────────────────────
  lint:
    name: "Lint (ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Lint ML jobs
        run: |
          ruff check src/finance_mlops/pipelines/training/ src/finance_mlops/pipelines/inference/batch_streaming/ src/finance_mlops/pipelines/lakehouse/features/ src/finance_mlops/pipelines/inference/online_kserve/ orchestration/airflow/dags/ \
            --select E,W,F,I \
            --ignore E501

  kserve-assets:
    name: "KServe assets validation"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install project dependencies
        run: pip install -e .

      - name: Validate predictor modules compile
        run: |
          python -m py_compile src/finance_mlops/pipelines/training/export_model_for_serving_job.py src/finance_mlops/pipelines/inference/online_kserve/predictor.py

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate KServe kustomize output
        run: kubectl kustomize deploy/k8s/kserve/overlays/dev > /tmp/kserve-dev.yaml

  # ── Track A-2: DAG validation ────────────────────────────────────────────────
  dag-validation:
    name: "Airflow DAG validation"
    runs-on: ubuntu-latest
    needs: [lint, kserve-assets]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Airflow (no extras needed for import check)
        run: |
          pip install "apache-airflow>=2.8.0" --constraint \
            "https://raw.githubusercontent.com/apache/airflow/constraints-2.8.4/constraints-3.11.txt"

      - name: Check DAG imports
        run: |
          python -c "import orchestration.airflow.dags.finance_lakehouse_dag; print('finance_lakehouse_dag: OK')"
          python -c "import orchestration.airflow.dags.finance_ml_training_dag; print('finance_ml_training_dag: OK')"
        env:
          PYTHONPATH: ${{ github.workspace }}/src

  # ── Track A-3: Unit tests ────────────────────────────────────────────────────
  unit-tests:
    name: "Unit tests (pytest)"
    runs-on: ubuntu-latest
    needs: [lint, kserve-assets]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java (required by PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install project dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Run unit tests
        run: pytest tests/ -v --timeout=120
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          JAVA_HOME: ${{ env.JAVA_HOME }}

  # ── Track B: Smoke-test training (tiny data) ─────────────────────────────────
  smoke-train:
    name: "Smoke-test: train_job (synthetic data)"
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install project dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Generate synthetic data
        run: python -m finance_mlops.data_generator.main
        env:
          PYTHONPATH: ${{ github.workspace }}/src

      - name: Run full lakehouse pipeline (Bronze → Gold → Features → ML tables)
        run: |
          python -c "
          from finance_mlops.pipelines.common.utils.spark import get_spark
          from finance_mlops.pipelines.lakehouse.bronze.ingest_offline import run as bronze_offline
          from finance_mlops.pipelines.lakehouse.bronze.ingest_streaming import run as bronze_streaming
          from finance_mlops.pipelines.lakehouse.silver.process_dimensions import run as silver_dims
          from finance_mlops.pipelines.lakehouse.silver.process_facts import run as silver_facts
          from finance_mlops.pipelines.lakehouse.gold.build_dimensions import run as gold_dims
          from finance_mlops.pipelines.lakehouse.gold.build_facts import run as gold_facts
          from finance_mlops.pipelines.lakehouse.gold.build_obt import run as gold_obt
          from finance_mlops.pipelines.lakehouse.features.build_features import run as build_features
          from finance_mlops.pipelines.lakehouse.gold.build_ml_tables import run as build_ml
          spark = get_spark('ci_smoke')
          bronze_offline(spark); bronze_streaming(spark)
          silver_dims(spark); silver_facts(spark)
          gold_dims(spark); gold_facts(spark); gold_obt(spark)
          build_features(spark); build_ml(spark)
          spark.stop()
          print('Pipeline complete.')
          "
        env:
          PYTHONPATH: ${{ github.workspace }}/src

      - name: Smoke-test train_job.py
        run: python -m finance_mlops.pipelines.training.train_job
        env:
          PYTHONPATH: ${{ github.workspace }}/src

      - name: Verify MLflow run created
        run: |
          python -c "
          import mlflow, os
          mlflow.set_tracking_uri('file://' + os.path.join(os.getcwd(), 'artifacts', 'mlruns'))
          mlflow.set_experiment('fraud_detection')
          runs = mlflow.search_runs(order_by=['attribute.start_time DESC'], max_results=1)
          assert len(runs) > 0, 'No MLflow run found!'
          pr_auc = runs.iloc[0]['metrics.val_pr_auc']
          print(f'Latest run PR-AUC: {pr_auc:.4f}')
          assert pr_auc >= 0, 'PR-AUC should be non-negative'
          print('Smoke test PASSED.')
          "
        env:
          PYTHONPATH: ${{ github.workspace }}/src
